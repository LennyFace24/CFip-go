name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-amd64
            asset: CFip-windows-amd64.zip
          - os: macos-latest
            name: darwin-arm64
            asset: CFip-darwin-arm64.tar.gz
          - os: ubuntu-latest
            name: linux-amd64
            asset: CFip-linux-amd64.tar.gz

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Linux 下 Wails 基于 GTK4 + WebKit 6.0，需安装系统开发库
      - name: 安装 Linux 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: 安装 Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: 安装前端依赖
        working-directory: cmd/app/frontend
        run: npm install

      # cmd/app 是嵌套 Go 模块，需在子目录内构建
      - name: 构建应用
        working-directory: cmd/app
        run: wails3 task build

      - name: 列出产物
        shell: bash
        run: ls -R bin

      - name: 打包 (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path bin/CFip.exe -DestinationPath ${{ matrix.asset }}

      - name: 打包 (macOS / Linux)
        if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.asset }} -C bin CFip

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
